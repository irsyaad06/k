<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="36" fill="url(#grad1)"/>
  <circle cx="300" cy="270" r="170" fill="url(#sparkleGrad)" opacity="0.65"/>
  <!-- Graduation Cap -->
  <g transform="translate(300, 240) scale(1.15)">
    <polygon points="0,-75 140,-20 0,35 -140,-20" fill="#1e1b4b" stroke="#fde047" stroke-width="4"/>
    <path d="M-75,-5 C-75,55 75,55 75,-5 Z" fill="#312e81"/>
    <!-- Tassel -->
    <path d="M0,-20 C20,-10 65,-5 85,25 L95,85" stroke="#fde047" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="95" cy="90" r="12" fill="#eab308"/>
  </g>
  <!-- Diploma / Ijazah -->
  <g transform="translate(300, 390)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
    <rect x="-18" y="-22" width="36" height="44" rx="4" fill="#ef4444"/>
    <path d="M-8,22 L-14,48 L0,38 L14,48 L8,22 Z" fill="#dc2626"/>
  </g>
  <text x="300" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">HAPPY GRADUATION!</text>
  <text x="300" y="528" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="20" fill="#fef08a" text-anchor="middle">Selamat Wisuda, Mba Kei Tersayang 🎓✨</text>
</svg>
